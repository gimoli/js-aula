<body> 
    <h1>Olá, mundo!</h1> <!-- comentário em html -->
    <p>Este é o meu primeiro projeto em HTML.</p>
    <script> 
    // var n1 = window.prompt('Digite o primeiro número:') (window.prompt recebe string)
    // Number.parseInt : o número recebido deve ser inteiro (8)
    //Number.parseFloat : o número recebido deve ser real (8.5)
    //Number(n) : o proprio java reconhece o tipo de valor que recebe (8.5 + 8 = 16.5)
    var n1 = Number(window.prompt('Digite o primeiro número:'))
    var n2 = Number(window.prompt('Digite o segundo número:'))
    var s = n1 + n2
    window.alert(`A soma entre ${n1} e ${n2} é ${s}`) // concatenação
   //String(s) : converte o valor de s para string (texto)
    </script>
